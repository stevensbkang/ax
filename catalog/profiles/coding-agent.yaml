# A Portainer agent profile: everything about a task except what the user asks
# for. Portainer expands it into the AX Task; the planner only picks it by name.
apiVersion: portainer.io/v1alpha1
kind: AgentProfile
metadata:
  name: coding-agent
spec:
  description: Makes a project's failing tests pass, then reports the change and the test results.
  image: localhost:5001/ax-demo-agent@sha256:5add3b29890c1bfc302b672c07be605d54604ff687816d5aebb10b1288959d69
  command: ["python3", "/opt/agent/agent.py"]
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
  modelGateway: http://ax-model-gateway.ax-system.svc.cluster.local:8080
  debug: true
  # Agent Substrate egress rules: the task reaches the model gateway and
  # GitHub (to clone its workspace), and nothing else.
  egress:
    - http:
        hostnames: [ax-model-gateway.ax-system.svc.cluster.local]
        ports: {numbers: [8080]}
    - tlsPassthrough:
        hostnames: [github.com]
        ports: {numbers: [443]}
