# The gateway reads its provider, model and key from the Secret
# ax-model-gateway, which Portainer will sync from a Shared Credential.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-model-gateway
  namespace: ax-system
spec:
  selector:
    matchLabels:
      app: ax-model-gateway
  template:
    metadata:
      labels:
        app: ax-model-gateway
    spec:
      containers:
        - name: gateway
          image: localhost:5001/ax-model-gateway:demo
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_PROVIDER
              valueFrom: {secretKeyRef: {name: ax-model-gateway, key: provider}}
            - name: MODEL_NAME
              valueFrom: {secretKeyRef: {name: ax-model-gateway, key: model}}
            - name: MODEL_API_KEY
              valueFrom: {secretKeyRef: {name: ax-model-gateway, key: apiKey}}
            - name: MODEL_BASE_URL
              valueFrom: {secretKeyRef: {name: ax-model-gateway, key: baseURL, optional: true}}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: ax-model-gateway
  namespace: ax-system
spec:
  selector:
    app: ax-model-gateway
  ports:
    - port: 8080
      targetPort: 8080
